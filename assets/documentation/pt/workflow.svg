          <rect x="22" y="22" width="48" height="48" rx="14" fill="#172554" stroke="#2563EB" stroke-opacity="0.7"/>
          <text x="46" y="54" text-anchor="middle"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="18" font-weight="700" fill="#BFDBFE">02</text>

          <text x="22" y="105"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="25" font-weight="700" fill="#F8FAFC">Configurar</text>

          <text x="22" y="139"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="15" font-weight="400" fill="#94A3B8">
                <tspan x="22" dy="0">Defina a operação</tspan>
                <tspan x="22" dy="22">e os parâmetros.</tspan>
          </text>

            <path d="M246 94 H286" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
            <path d="M276 84 L286 94 L276 104" fill="none" stroke="#60A5FA" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(686 282)">
          <rect width="228" height="190" rx="22" fill="#111827" stroke="#243244" stroke-width="2"/>
          <rect x="1" y="1" width="226" height="188" rx="21" fill="url(#cardGlow)" opacity="0.8"/>

          <rect x="22" y="22" width="48" height="48" rx="14" fill="#172554" stroke="#2563EB" stroke-opacity="0.7"/>
          <text x="46" y="54" text-anchor="middle"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="18" font-weight="700" fill="#BFDBFE">03</text>

          <text x="22" y="105"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="25" font-weight="700" fill="#F8FAFC">Processar</text>

          <text x="22" y="139"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="15" font-weight="400" fill="#94A3B8">
            <tspan x="22" dy="0">Execute tudo localmente</tspan>
            <tspan x="22" dy="22">no dispositivo.</tspan>
          </text>

            <path d="M246 94 H286" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
            <path d="M276 84 L286 94 L276 104" fill="none" stroke="#60A5FA" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(984 282)">
          <rect width="228" height="190" rx="22" fill="#111827" stroke="#243244" stroke-width="2"/>
          <rect x="1" y="1" width="226" height="188" rx="21" fill="url(#cardGlow)" opacity="0.8"/>

          <rect x="22" y="22" width="48" height="48" rx="14" fill="#172554" stroke="#2563EB" stroke-opacity="0.7"/>
          <text x="46" y="54" text-anchor="middle"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="18" font-weight="700" fill="#BFDBFE">04</text>

          <text x="22" y="105"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="25" font-weight="700" fill="#F8FAFC">Revisar</text>

          <text x="22" y="139"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="15" font-weight="400" fill="#94A3B8">
            <tspan x="22" dy="0">Confira o resultado</tspan>
            <tspan x="22" dy="22">antes de salvar.</tspan>
          </text>

            <path d="M246 94 H286" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
            <path d="M276 84 L286 94 L276 104" fill="none" stroke="#60A5FA" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(1282 282)">
          <rect width="228" height="190" rx="22" fill="#111827" stroke="#243244" stroke-width="2"/>
          <rect x="1" y="1" width="226" height="188" rx="21" fill="url(#cardGlow)" opacity="0.8"/>

          <rect x="22" y="22" width="48" height="48" rx="14" fill="#172554" stroke="#2563EB" stroke-opacity="0.7"/>
          <text x="46" y="54" text-anchor="middle"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="18" font-weight="700" fill="#BFDBFE">05</text>

          <text x="22" y="105"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="25" font-weight="700" fill="#F8FAFC">Exportar</text>

          <text x="22" y="139"
                font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
                font-size="15" font-weight="400" fill="#94A3B8">
            <tspan x="22" dy="0">Gere o arquivo final</tspan>
            <tspan x="22" dy="22">no destino escolhido.</tspan>
          </text>

        </g>

  <g transform="translate(90 526)">
    <circle cx="7" cy="7" r="7" fill="#2563EB"/>
    <circle cx="7" cy="7" r="2.5" fill="#BFDBFE"/>
    <text x="27" y="13"
          font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif"
          font-size="15" font-weight="600"
