<svg xmlns="http://www.w3.org/2000/svg"
     width="1600" height="760" viewBox="0 0 1600 760"
     role="img" aria-label="ForgeDocs documentation hub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090C11"/>
      <stop offset="58%" stop-color="#0D1118"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#2563EB" stop-opacity="0.025"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="0%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none"
            stroke="#94A3B8" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="28" fill="url(#grid)"/>
  <rect width="1600" height="760" rx="28" fill="url(#glow)"/>

  <g transform="translate(88 62)">
    <rect width="58" height="6" rx="3" fill="url(#accent)"/>
    <text x="0" y="48"
          font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700"
          letter-spacing="3.2" fill="#7DD3FC">DOCUMENTATION</text>
    <text x="0" y="116"
          font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700"
          letter-spacing="-1.5" fill="#F8FAFC">A technical foundation to understand, maintain and evolve.</text>
    <text x="0" y="166"
          font-family="Host Grotesk, Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400"
          fill="#94A3B8">Essential guides for architecture, development, interface and ForgeDocs identity.</text>
  </g>

  
  <g>
    <rect x="88" y="292" width="440" height="146" rx="22"
          fill="#111827" stroke="#243244" stroke-width="2"/>
    <rect x="89" y="293" width="438" height="144" rx="21"
          fill="url(#cardGlow)" opacity="0.78"/>

    <rect x="112" y="316" width="58" height="58" rx="15"
