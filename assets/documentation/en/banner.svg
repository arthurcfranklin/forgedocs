      <rect x="103" y="139" width="158" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.90"/>
      <rect x="103" y="171" width="184" height="8" rx="4" fill="#94A3B8" fill-opacity="0.56"/>
      <rect x="103" y="199" width="166" height="8" rx="4" fill="#94A3B8" fill-opacity="0.42"/>
      <rect x="103" y="227" width="122" height="8" rx="4" fill="#94A3B8" fill-opacity="0.34"/>

      <rect x="103" y="276" width="98" height="36" rx="10" fill="#2563EB"/>
      <path d="M131 294 H173" stroke="#DBEAFE" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(8 252)">
      <rect width="108" height="108" rx="26" fill="#111827" stroke="#334155" stroke-width="2"/>
      <path d="M32 34 H70 L82 46 V77 C82 83 77 88 71 88 H32 C26 88 21 83 21 77 V45 C21 39 26 34 32 34 Z"
            fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M69 34 V46 H82" fill="none" stroke="#93C5FD" stroke-width="5" stroke-linejoin="round"/>
    </g>
